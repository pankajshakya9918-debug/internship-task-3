<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Study Assistant</title><link rel="stylesheet" href="style.css"></head><body><main><div class="brand">✦ StudyMate AI</div><p class="eyebrow">YOUR PERSONAL LEARNING HELPER</p><h1>What are you learning today?</h1><p class="sub">Ask a question, summarize a topic, or get a simple explanation.</p><form id="askForm"><label for="prompt">Your question</label><textarea id="prompt" maxlength="4000" required placeholder="Explain HTML and CSS to a beginner..."></textarea><div class="bottom"><span id="count">0 / 4000</span><button id="send" type="submit">Ask AI ↗</button></div></form><div id="status" role="status"></div><section id="answer" hidden><h2>Response</h2><pre id="answerText"></pre></section><div class="examples"><button data-prompt="Explain HTML and CSS to a beginner with examples.">Explain HTML/CSS</button><button data-prompt="Create five quiz questions about JavaScript basics and provide answers separately.">Make a quiz</button><button data-prompt="Give me a simple study plan for learning web development in 7 days.">Study plan</button></div><p class="note">Do not enter private or sensitive information. AI responses can contain mistakes.</p></main><script src="app.js"></script></body></html>
